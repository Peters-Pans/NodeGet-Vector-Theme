<!doctype html>
<html lang="zh-CN" data-default-design="vector">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Next-generation server monitoring and management tools" />
    <link rel="icon" type="image/svg+xml" href="./favicon-vector.svg" />
    <title>Observatory · NodeGet</title>
    <script>
      try {
        var design = new URLSearchParams(location.search).get('design') || localStorage.getItem('observatory.design') || 'vector';
        document.documentElement.dataset.design = design === 'orbit' ? 'orbit' : 'vector';
        document.documentElement.dataset.light = localStorage.getItem('observatory.light') || 'false';
        document.querySelector('link[rel="icon"]').href = './favicon-' + document.documentElement.dataset.design + '.svg';
      } catch (_) {}
    </script>
    <link rel="stylesheet" href="./custom.css" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="./custom.js" defer></script>
  </body>
</html>
